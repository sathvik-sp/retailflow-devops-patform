apiVersion: apps/v1
kind: Deployment
metadata:
  name: retailflow-api
  namespace: dev
  labels:
    app: retailflow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retailflow-api
  template:
    metadata:
      labels:
        app: retailflow-api
    spec:
      containers:
        - name: retailflow-api
          image: acrretailflowdev.azurecr.io/retailflow-api:dev
          ports:
            - containerPort: 5000
          
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
