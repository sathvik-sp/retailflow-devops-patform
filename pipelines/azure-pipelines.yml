trigger: 
  - master
pool: 
  vmImage: 'ubuntu-latest'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: 'Set up Python 3.12'

  - script: |
      cd application
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install dependencies'
  
  - script: |
      cd application
      pytest
    displayName: 'Run tests'

  - task: Docker@2
    inputs:
      containerRegistry: 'sc-retailflow-acr'
      repository: 'retailflow-api'
      command: 'buildAndPush'
      Dockerfile: 'application/Dockerfile'
      tags: '$(Build.SourceVersion)'
    displayName: 'Build and Push Docker image to ACR'

  - task: AzureCLI@3
    inputs:
      connectionType: 'azureRM'
      azureSubscription: 'Azure subscription 1(4493e15d-c6a9-4412-bd34-6ef713cd0f5d)'
      scriptType: 'batch'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az aks get-credentials \
                  --resource-group rg-retailflow-devops-platform \
                  --name aks-retailflow-dev \
                  --overwrite-existing
        
        kubectl set image deployment/retailflow-api \
                  retailflow-api=acrretailflowdev.azurecr.io/retailflow-api:$(Build.SourceVersion) \
                  -n dev
        
        kubectl rollout status deployment/retailflow-api -n dev
    displayName: 'Deploy to AKS DEV'