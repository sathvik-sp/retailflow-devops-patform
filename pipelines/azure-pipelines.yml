trigger: 
  - master
  - day*
pool: 
  vmImage: 'ubuntu-latest'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: 'Set up Python 3.12'

  - script: |
      cd application
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install dependencies'
  
  - script: |
      cd application
      pytest
    displayName: 'Run tests'

  - task: Docker@2
    inputs:
      containerRegistry: 'sc-retailflow-acr'
      repository: 'retailflow-api'
      command: 'buildAndPush'
      Dockerfile: 'application/Dockerfile'
      tags: '$(Build.SourceVersion)'
    displayName: 'Build and Push Docker image to ACR'

  - script: |
      sudo apt-get update
      sudo apt-get install -y wget
      wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
      echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
      sudo apt-get update
      sudo apt-get install -y trivy
      trivy --version
    displayName: 'Install Trivy'

  - script: |
      trivy image \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --exit-code 1 \
        acrretailflowdev.azurecr.io/retailflow-api:$(Build.SourceVersion)
    displayName: 'Scan Docker image'

  - task: AzureCLI@2
    inputs:
      azureSubscription: 'Azure-subscription-SC'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az aks get-credentials --resource-group rg-retailflow-devops-platform --name aks-retailflow-dev --overwrite-existing 
        kubectl set image deployment/retailflow-api retailflow-api=acrretailflowdev.azurecr.io/retailflow-api:$(Build.SourceVersion) -n dev
        kubectl rollout status deployment/retailflow-api -n dev
        kubectl port-forward -n dev service/retailflow-api 8080:80 > /tmp/retailflow-port-forward.log 2>&1 &
        sleep 5
        curl --fail http://localhost:8080/health
    displayName: 'Deploy to AKS DEV'